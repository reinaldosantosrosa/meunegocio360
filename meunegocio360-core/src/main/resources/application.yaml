spring:
  application:
    name: meunegocio360-core
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/meunegocio360_core?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      expiracao-minutos: ${AUTH_JWT_EXPIRACAO_MINUTOS:15}
    refresh:
      expiracao-dias: ${AUTH_REFRESH_EXPIRACAO_DIAS:7}
    max-tentativas: ${AUTH_MAX_TENTATIVAS:5}
    bloqueio-minutos: ${AUTH_BLOQUEIO_MINUTOS:15}
    cookie:
      secure: ${AUTH_COOKIE_SECURE:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
